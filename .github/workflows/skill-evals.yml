# Grades this repo's skills with https://github.com/danielholanda/skillscope:
# structure (free), then routing (which skill fires) and behavioral (what the
# agent did once it fired).

name: skill-evals

on:
  pull_request:
    paths:
      - "TraceLens/Agent/Analysis/skills/**"
      - ".github/workflows/skill-evals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: danielholanda/skillscope@main
        with:
          command: structural
          skills: TraceLens/Agent/Analysis/skills/analysis-orchestrator

  routing:
    needs: structural
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: danielholanda/skillscope@main
        with:
          command: routing
          skills: TraceLens/Agent/Analysis/skills/analysis-orchestrator
          install-claude: "true"

  behavioral:
    needs: structural
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: danielholanda/skillscope@main
        with:
          command: behavioral
          skills: TraceLens/Agent/Analysis/skills/analysis-orchestrator
          install-claude: "true"
