# Catch link rot in the federated TraceLens skill before the catalog's nightly
# run does. `mode: references` skips the graded runs, so this costs one ubuntu
# runner and no model calls.
#
# See: https://github.com/amd/skills/blob/main/CONTRIBUTING.md

name: skills-checks

on:
  pull_request:
    paths:
      - "TraceLens/Agent/Analysis/skills/analysis-orchestrator/**"
      - ".github/workflows/skills-checks.yml"
  workflow_dispatch:

jobs:
  analysis-orchestrator-external-references:
    uses: amd/skillscope/.github/workflows/skill-evals.yml@v0.1.3
    with:
      # `skill_globs` names the directories that ARE skills. `skills` is a
      # different input -- a list of names to run behavioral cases for -- and
      # leaving `skill_globs` at its `./*` default would point the check at
      # every directory in the repository root.
      skill_globs: TraceLens/Agent/Analysis/skills/analysis-orchestrator
      mode: references
      external_references: true
    permissions:
      contents: read
