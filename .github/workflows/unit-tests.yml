name: Unit Tests

on:
  push:
    branches: [ main ]
    paths:
      - "**/*.py"
      - "tests/**"
      - "setup.py"
      - "MANIFEST.in"
      - ".coveragerc"
      - ".test_durations"
      - "codecov.yml"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "**/*.py"
      - "tests/**"
      - "setup.py"
      - "MANIFEST.in"
      - ".coveragerc"
      - ".test_durations"
      - "codecov.yml"
      - ".github/workflows/unit-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # rocm-origami is required by roofline / Origami perf-model tests.
    container: rocm/dev-ubuntu-24.04:7.2.1
    strategy:
      fail-fast: false
      matrix:
        # Four shards is the smallest split that can reach the longest test:
        # each runner has 4 cores, and 16 workers cover the suite's total work.
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Restore test durations
        uses: actions/cache/restore@v4
        with:
          path: .test_durations
          # Never hits on this run. The prefix picks up the merged file from the
          # previous run. A miss leaves the checked-in file in place.
          key: test-durations-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-durations-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          apt update && apt install -y python3-venv git
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install '.[jax,kernel_source]' pytest pytest-xdist pytest-split pytest-cov openpyxl orjson rocm-origami
          # CPU torch + transformers are required by the Visualizer / ModelUtils
          # unit tests under tests/Modeling and tests/Visualizer (FX tracing, shape
          # inference, HF source introspection). Pinned to the versions the tests
          # were validated against.
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.0'
          pip install 'transformers==5.16.1' 'huggingface_hub==1.30.0'

      - name: Run unit tests
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -v --tb=short -n auto --dist worksteal \
            --splits 4 --group ${{ matrix.shard }} \
            --splitting-algorithm least_duration \
            --durations-path .test_durations \
            --store-durations \
            -m "not gpu" --durations=20 \
            --cov=./TraceLens --cov-config=.coveragerc \
            --cov-report=xml \
            --junitxml=junit.xml -o junit_family=legacy
          test -s .coverage

      - name: Upload coverage data
        uses: actions/upload-artifact@v6
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload junit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: junit-report-${{ matrix.shard }}
          path: junit.xml
          if-no-files-found: error

      - name: Upload test durations
        uses: actions/upload-artifact@v6
        with:
          name: test-durations-${{ matrix.shard }}
          path: .test_durations
          include-hidden-files: true
          if-no-files-found: error

  codecov:
    name: Codecov
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: false

      - name: Download junit reports
        uses: actions/download-artifact@v8
        with:
          pattern: junit-report-*
          merge-multiple: false

      - name: Combine coverage
        run: |
          python -m pip install --upgrade pip coverage
          python -m coverage combine coverage-data-*/.coverage
          python -m coverage xml
          python -m coverage report --fail-under=95

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unit
          fail_ci_if_error: true
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit-report-1/junit.xml,junit-report-2/junit.xml,junit-report-3/junit.xml,junit-report-4/junit.xml
          report_type: test_results
          flags: unit
          fail_ci_if_error: true
          verbose: true

      - name: Download test durations
        uses: actions/download-artifact@v8
        with:
          pattern: test-durations-*
          merge-multiple: false

      - name: Merge test durations
        run: |
          python - << 'PY'
          import json
          from collections import Counter
          from pathlib import Path

          paths = sorted(Path(".").glob("test-durations-*/.test_durations"))
          if len(paths) != 4:
              raise SystemExit(f"expected 4 duration files, found {[str(p) for p in paths]}")
          maps = [json.loads(path.read_text()) for path in paths]
          merged = {}
          for key in set().union(*(item.keys() for item in maps)):
              counts = Counter(item[key] for item in maps if key in item)
              # The shard that ran a test is the only one with a new time.
              merged[key] = min(counts, key=lambda value: (counts[value], value))
          Path(".test_durations").write_text(json.dumps(merged, indent=4, sort_keys=True) + "\n")
          print(f"merged {len(merged)} durations from {len(paths)} shards")
          PY

      - name: Save test durations
        uses: actions/cache/save@v4
        with:
          path: .test_durations
          key: test-durations-${{ github.run_id }}-${{ github.run_attempt }}
