# Pull requests run the tests related to the files they change
# (scripts/select_related_tests.py). Pushes to main run the full suite.

name: Unit Tests

on:
  push:
    branches: [ main ]
    paths:
      - "**/*.py"
      - "tests/**"
      - "setup.py"
      - "MANIFEST.in"
      - ".coveragerc"
      - ".test_durations"
      - "codecov.yml"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "**/*.py"
      - "tests/**"
      - "setup.py"
      - "MANIFEST.in"
      - ".coveragerc"
      - ".test_durations"
      - "codecov.yml"
      - ".github/workflows/unit-tests.yml"

jobs:
  select-pr-tests:
    name: Select PR tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Select related tests
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            python3 scripts/select_related_tests.py --all \
              --github-output "$GITHUB_OUTPUT" \
              --write-list selected_tests.txt
            exit 0
          fi
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            > "$RUNNER_TEMP/changed.txt"
          python3 scripts/select_related_tests.py \
            --changed-from "$RUNNER_TEMP/changed.txt" \
            --exclude-test-prefix tests/ModelUtils/ \
            --exclude-test-prefix tests/Visualizer/ \
            --github-output "$GITHUB_OUTPUT" \
            --write-list selected_tests.txt

      - name: Upload selected tests
        uses: actions/upload-artifact@v6
        with:
          name: selected-tests
          path: selected_tests.txt
          if-no-files-found: error

  changes:
    runs-on: ubuntu-latest
    outputs:
      modelutils: ${{ steps.filter.outputs.modelutils }}
      visualizer: ${{ steps.filter.outputs.visualizer }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Detect relevant changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          python - << 'PY'
          import os
          import subprocess

          def matches(path, prefixes):
              return any(path == prefix or path.startswith(prefix) for prefix in prefixes)

          # Shared test inputs both suites read. A change here can move either result.
          shared = (
              "tests/model_pins.py",
              "tests/fixtures/",
              "tests/conftest.py",
              "setup.py",
              "MANIFEST.in",
              ".github/workflows/unit-tests.yml",
          )
          modelutils_paths = ("TraceLens/ModelUtils/", "tests/ModelUtils/") + shared
          visualizer_paths = ("TraceLens/Visualizer/", "tests/Visualizer/") + shared

          event = os.environ["EVENT_NAME"]
          before = os.environ.get("BEFORE", "")
          if event == "push" and (not before or set(before) == {"0"}):
              # A new branch has no parent to diff against.
              modelutils = visualizer = True
          else:
              if event == "push":
                  base = before
              else:
                  base = subprocess.check_output(
                      ["git", "merge-base", "HEAD", "origin/main"], text=True
                  ).strip()
              files = subprocess.check_output(
                  ["git", "diff", "--name-only", base, "HEAD"], text=True
              ).splitlines()
              modelutils = any(matches(path, modelutils_paths) for path in files)
              visualizer = any(matches(path, visualizer_paths) for path in files)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"modelutils={'true' if modelutils else 'false'}\n")
              handle.write(f"visualizer={'true' if visualizer else 'false'}\n")
          print(f"modelutils={modelutils} visualizer={visualizer}")
          PY

  unit-tests:
    needs: select-pr-tests
    if: needs.select-pr-tests.outputs.mode != 'none'
    runs-on: ubuntu-latest
    # rocm-origami is required by roofline / Origami perf-model tests. It is pinned
    # because tests/test_origami_reference.py holds results for that exact version.
    container: rocm/dev-ubuntu-24.04:7.2.1
    defaults:
      run:
        # This image runs steps with dash. The test step needs bash for pipefail and mapfile.
        shell: bash
    env:
      TEST_MODE: ${{ needs.select-pr-tests.outputs.mode }}
    strategy:
      fail-fast: false
      matrix:
        # Four shards is the smallest split that can reach the longest test:
        # each runner has 4 cores, and 16 workers cover the suite's total work.
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        if: env.TEST_MODE != 'none'
        uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Download selected tests
        if: env.TEST_MODE == 'selected'
        uses: actions/download-artifact@v8
        with:
          name: selected-tests
          path: selected-tests

      - name: Restore test durations
        if: env.TEST_MODE != 'none'
        uses: actions/cache/restore@v4
        with:
          path: .test_durations
          # Never hits on this run. The prefix picks up the merged file from the
          # previous run. A miss leaves the checked-in file in place.
          key: test-durations-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            test-durations-

      - name: Drop incompatible toolcache Python
        if: env.TEST_MODE != 'none'
        run: sh scripts/reset_incompatible_toolcache_python.sh

      - name: Set up Python
        if: env.TEST_MODE != 'none'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: env.TEST_MODE != 'none'
        run: |
          apt update && apt install -y python3-venv git
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install '.[jax,kernel_source]' pytest pytest-xdist pytest-split pytest-cov openpyxl orjson rocm-origami==0.0.3

      - name: Run unit tests
        id: tests
        run: |
          set -euo pipefail
          if [ "$TEST_MODE" = "none" ]; then
            echo "No tests relate to the changed files."
            exit 0
          fi
          . .venv/bin/activate
          if [ "$TEST_MODE" = "all" ]; then
            python -m pytest tests/ -v --tb=short -n auto --dist worksteal \
              --ignore=tests/ModelUtils --ignore=tests/Visualizer \
              --splits 4 --group ${{ matrix.shard }} \
              --splitting-algorithm least_duration \
              --durations-path .test_durations \
              --store-durations \
              -m "not gpu" --durations=20 \
              --cov=./TraceLens --cov-config=.coveragerc \
              --cov-report=xml \
              --junitxml=junit.xml -o junit_family=legacy
            test -s .coverage
            echo "has_coverage=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TEST_MODE" != "selected" ]; then
            echo "Unknown TEST_MODE: $TEST_MODE" >&2
            exit 1
          fi
          list_file=$(find selected-tests -name selected_tests.txt -print -quit 2>/dev/null || true)
          if [ -z "$list_file" ]; then
            echo "selected_tests.txt was not downloaded" >&2
            find selected-tests -print >&2 || true
            exit 1
          fi
          mapfile -t files < "$list_file"
          set +e
          python -m pytest "${files[@]}" -v --tb=short -n auto --dist worksteal \
            --splits 4 --group ${{ matrix.shard }} \
            --splitting-algorithm least_duration \
            --durations-path .test_durations \
            -m "not gpu" --durations=20
          rc=$?
          set -e
          if [ "$rc" -eq 5 ]; then
            echo "No selected tests in shard ${{ matrix.shard }}."
            exit 0
          fi
          exit "$rc"

      - name: Upload coverage data
        if: steps.tests.outputs.has_coverage == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload junit report
        if: ${{ !cancelled() && needs.select-pr-tests.outputs.mode == 'all' }}
        uses: actions/upload-artifact@v6
        with:
          name: junit-report-${{ matrix.shard }}
          path: junit.xml
          if-no-files-found: error

      - name: Upload test durations
        if: needs.select-pr-tests.outputs.mode == 'all'
        uses: actions/upload-artifact@v6
        with:
          name: test-durations-${{ matrix.shard }}
          path: .test_durations
          include-hidden-files: true
          if-no-files-found: error

  modelutils-tests:
    needs: changes
    if: needs.changes.outputs.modelutils == 'true'
    runs-on: ubuntu-latest
    # Same image as the main suite so CPU torch and the rest of the toolchain match.
    container: rocm/dev-ubuntu-24.04:7.2.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Drop incompatible toolcache Python
        run: sh scripts/reset_incompatible_toolcache_python.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          apt update && apt install -y python3-venv git
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install '.[jax,kernel_source]' pytest pytest-xdist pytest-cov openpyxl orjson rocm-origami
          # CPU torch + transformers are required by the ModelUtils unit tests
          # (FX tracing, shape inference, HF source introspection). Pinned to
          # the versions the tests were validated against.
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.0'
          pip install 'transformers==5.16.1' 'huggingface_hub==1.30.0'

      - name: Run ModelUtils tests
        run: |
          . .venv/bin/activate
          python -m pytest tests/ModelUtils -v --tb=short -n auto --dist worksteal \
            -m "not gpu" --durations=20 \
            --cov=./TraceLens --cov-config=.coveragerc \
            --cov-report=xml \
            --junitxml=junit.xml -o junit_family=legacy
          test -s .coverage

      - name: Upload coverage data
        uses: actions/upload-artifact@v6
        with:
          name: coverage-data-modelutils
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload junit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: junit-report-modelutils
          path: junit.xml
          if-no-files-found: error

  visualizer-tests:
    needs: changes
    if: needs.changes.outputs.visualizer == 'true'
    runs-on: ubuntu-latest
    container: rocm/dev-ubuntu-24.04:7.2.1
    strategy:
      fail-fast: false
      matrix:
        # Four shards. Each runner has 4 cores, and the suite is a few hundred
        # tests dominated by session-scoped graph builds.
        #
        # Two shards left the slower one carrying 2705s of tests against the
        # other's 1766s and gating the whole workflow at 14m44s. The split is
        # by COUNT rather than time whenever the durations cache misses -- it
        # had never been populated, so `least_duration` was handed `{}` and
        # divided 304 tests against 303 with no idea what they cost. Four
        # shards cut what any one of them can be left holding; once the
        # durations cache carries forward, the split balances on time as well.
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Restore test durations
        uses: actions/cache/restore@v4
        with:
          path: .test_durations_visualizer
          key: visualizer-test-durations-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            visualizer-test-durations-

      - name: Drop incompatible toolcache Python
        run: sh scripts/reset_incompatible_toolcache_python.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          apt update && apt install -y python3-venv git
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install '.[jax,kernel_source]' pytest pytest-xdist pytest-split pytest-cov openpyxl orjson rocm-origami
          # CPU torch + transformers are required by the Visualizer unit tests
          # (FX tracing, shape inference, HF source introspection). Pinned to
          # the versions the tests were validated against.
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.0'
          pip install 'transformers==5.16.1' 'huggingface_hub==1.30.0'

      - name: Run Visualizer tests
        run: |
          . .venv/bin/activate
          if [ ! -f .test_durations_visualizer ]; then
            echo '{}' > .test_durations_visualizer
          fi
          python -m pytest tests/Visualizer -v --tb=short -n auto --dist worksteal \
            --splits 4 --group ${{ matrix.shard }} \
            --splitting-algorithm least_duration \
            --durations-path .test_durations_visualizer \
            --store-durations \
            -m "not gpu" --durations=20 \
            --cov=./TraceLens --cov-config=.coveragerc \
            --cov-report=xml \
            --junitxml=junit.xml -o junit_family=legacy
          test -s .coverage

      - name: Upload coverage data
        uses: actions/upload-artifact@v6
        with:
          name: coverage-data-visualizer-${{ matrix.shard }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload junit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: junit-report-visualizer-${{ matrix.shard }}
          path: junit.xml
          if-no-files-found: error

      - name: Upload test durations
        uses: actions/upload-artifact@v6
        with:
          name: test-durations-visualizer-${{ matrix.shard }}
          path: .test_durations_visualizer
          include-hidden-files: true
          if-no-files-found: error

  codecov:
    name: Codecov
    needs: [select-pr-tests, unit-tests, changes, modelutils-tests, visualizer-tests]
    if: >-
      !cancelled() &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      needs.changes.result == 'success' &&
      (needs.modelutils-tests.result == 'success' || needs.modelutils-tests.result == 'skipped') &&
      (needs.visualizer-tests.result == 'success' || needs.visualizer-tests.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Skip coverage gate for a partial PR run
        if: needs.select-pr-tests.outputs.mode != 'all'
        run: echo "Related-test run; the coverage gate stays on the full suite."

      - name: Checkout code
        if: success() && needs.select-pr-tests.outputs.mode == 'all'
        uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Set up Python
        if: success() && needs.select-pr-tests.outputs.mode == 'all'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download coverage data
        if: success() && needs.select-pr-tests.outputs.mode == 'all'
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: false

      - name: Download junit reports
        if: success() && needs.select-pr-tests.outputs.mode == 'all'
        uses: actions/download-artifact@v8
        with:
          pattern: junit-report-*
          merge-multiple: false

      - name: Combine coverage
        if: success() && needs.select-pr-tests.outputs.mode == 'all'
        run: |
          python -m pip install --upgrade pip coverage
          python -m coverage combine coverage-data-*/.coverage
          python -m coverage xml
          python -m coverage report --fail-under=95

      - name: Upload coverage to Codecov
        if: success() && needs.select-pr-tests.outputs.mode == 'all'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unit
          fail_ci_if_error: true
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && needs.select-pr-tests.outputs.mode == 'all' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit-report-1/junit.xml,junit-report-2/junit.xml,junit-report-3/junit.xml,junit-report-4/junit.xml
          report_type: test_results
          flags: unit
          fail_ci_if_error: true
          verbose: true

      - name: Download test durations
        if: success() && needs.select-pr-tests.outputs.mode == 'all'
        uses: actions/download-artifact@v8
        with:
          pattern: test-durations-*
          merge-multiple: false

      - name: Merge test durations
        if: success() && needs.select-pr-tests.outputs.mode == 'all'
        run: |
          python - << 'PY'
          import json
          from collections import Counter
          from pathlib import Path

          paths = sorted(Path(".").glob("test-durations-*/.test_durations"))
          if len(paths) != 4:
              raise SystemExit(f"expected 4 duration files, found {[str(p) for p in paths]}")
          maps = [json.loads(path.read_text()) for path in paths]
          merged = {}
          for key in set().union(*(item.keys() for item in maps)):
              counts = Counter(item[key] for item in maps if key in item)
              # The shard that ran a test is the only one with a new time.
              merged[key] = min(counts, key=lambda value: (counts[value], value))
          Path(".test_durations").write_text(json.dumps(merged, indent=4, sort_keys=True) + "\n")
          print(f"merged {len(merged)} durations from {len(paths)} shards")
          PY

      - name: Save test durations
        if: success() && needs.select-pr-tests.outputs.mode == 'all'
        uses: actions/cache/save@v4
        with:
          path: .test_durations
          key: test-durations-${{ github.run_id }}-${{ github.run_attempt }}
