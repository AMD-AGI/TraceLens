name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black==26.1.0 ruff==0.16.1 import-linter==2.13  # Pin for CI reproducibility; use same versions locally

    - name: Run Black
      # only run black on changed files based on this example:
      run: |
        changed_files=$(git diff --diff-filter=d --name-only $(git merge-base HEAD origin/main) HEAD | grep '\.py$' || true)
        if [ -n "$changed_files" ]; then
          echo "$changed_files" | xargs echo "Running black on changed files: "
          echo "$changed_files" | xargs black --check
        fi

    - name: Run Ruff (unused imports, assignments, and return consistency)
      run: |
        changed_files=$(git diff --diff-filter=d --name-only $(git merge-base HEAD origin/main) HEAD | grep '\.py$' || true)
        if [ -n "$changed_files" ]; then
          echo "$changed_files" | xargs echo "Running ruff on changed files: "
          echo "$changed_files" | xargs ruff check --select F401,F841,RET502,RET503
        fi

    - name: Run Import Linter (no circular dependencies)
      run: lint-imports
