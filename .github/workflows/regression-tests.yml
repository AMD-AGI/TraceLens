name: Regression Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    # rocm-origami needs rocm
    container: rocm/dev-ubuntu-24.04:7.2.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          apt update && apt install -y python3-venv git
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install . pytest pytest-xdist openpyxl orjson 'protobuf>=6.31.1,<7.0.0' rocm-origami

      - name: Run regression tests
        run: |
          . .venv/bin/activate
          python -m pytest \
            tests/test_subtract_intervals.py \
            tests/test_graph_mode.py \
            tests/test_kernel_launchers.py \
            tests/test_call_stack_perf_report.py \
            tests/test_rocprof_perf_report.py \
            tests/test_perf_report_regression.py \
            tests/test_compare_perf_reports.py \
            tests/test_tracediff_regression.py \
            tests/test_tracediff.py \
            tests/test_inference_perf_report.py \
            tests/test_annotation_utils.py \
            tests/test_split_inference_trace_annotation.py \
            tests/test_collective_analysis.py \
            tests/test_all2allv_summary.py \
            tests/test_jax_perf_report.py \
            tests/test_detect_recompute.py \
            tests/test_copyright_headers.py \
            tests/test_analysis_agent.py \
            -v --tb=short -n auto
