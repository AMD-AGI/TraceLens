# Lightweight structural checks that run on every PR regardless of which files
# changed.  Intentionally has NO paths filter so that newly added files of any
# type are validated (e.g. copyright headers on .md/.yml/.sh files).

name: Structural Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structural-checks:
    name: Structural checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pytest
        run: pip install pytest

      - name: Run structural tests
        run: python -m pytest tests/test_copyright_headers.py -v --tb=short
