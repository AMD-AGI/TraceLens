# Codecov configuration for TraceLens.
# Fail PRs when overall project coverage or patch coverage drops vs the base branch.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        base: auto
        informational: false
    patch:
      default:
        target: auto
        base: auto
        informational: false

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true
  hide_project_coverage: false

github_checks:
  annotations: true

comment:
  show_carryforward_flags: true

flags:
  unit:
    paths:
      - TraceLens/
    carryforward: false
  gpu:
    paths:
      - TraceLens/EventReplay/
      - TraceLens/PerfModel/benchmarking/
    carryforward: true

fixes:
  - "/__w/TraceLens/TraceLens/::"
