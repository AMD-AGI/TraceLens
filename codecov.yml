# Codecov configuration for TraceLens.
# Enforce upload/processing and surface coverage in PRs; do not gate on
# coverage percentage yet (informational status checks).
coverage:
  status:
    project:
      default:
        target: auto
        base: auto
        informational: true
    patch: off

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true
  hide_project_coverage: false

fixes:
  - "/__w/TraceLens/TraceLens/::"
