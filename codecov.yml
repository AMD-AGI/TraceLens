# Codecov configuration for TraceLens.
# Fail PRs when overall project coverage drops vs the base branch.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        base: auto
        informational: false
    patch:
      default:
        target: auto
        base: auto
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true
  hide_project_coverage: false

github_checks:
  annotations: true

fixes:
  - "/__w/TraceLens/TraceLens/::"
