# Codecov configuration for TraceLens.
# Upload coverage from CI; do not enforce coverage percentage gates yet.
# Status checks are informational until project gates are enabled in a follow-up PR.
coverage:
  status:
    project: off
    patch: off

comment:
  show_carryforward_flags: true

flags:
  unit:
    paths:
      - TraceLens/
    carryforward: false
  gpu:
    paths:
      - TraceLens/EventReplay/
      - TraceLens/PerfModel/benchmarking/
    carryforward: true

fixes:
  - "/__w/TraceLens/TraceLens/::"
