# Codecov configuration for TraceLens.
# Enforce upload/processing and surface coverage in PRs. Project and patch
# status checks are informational (non-blocking) until we add coverage gates.
coverage:
  status:
    project:
      default:
        target: auto
        base: auto
        informational: true
    patch:
      default:
        target: auto
        base: auto
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true
  hide_project_coverage: false

github_checks:
  annotations: true

fixes:
  - "/__w/TraceLens/TraceLens/::"
