# Codecov configuration for TraceLens.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        base: auto
    patch: off

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true
  hide_project_coverage: false

fixes:
  - "/__w/TraceLens/TraceLens/::"
